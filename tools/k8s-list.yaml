identity:
  name: "k8s-list"
  author: "bond-zhu"
  label:
    en_US: "K8s List"
    zh_Hans: "K8s 列表"
    pt_BR: "K8s Lista"
    ja_JP: "K8s リスト"
description:
  human:
    en_US: "List Kubernetes resources using base64-encoded kubeconfig (or file path). Supports pods, deployments, statefulsets, daemonsets, services, ingresses. Default: pods."
    zh_Hans: "使用 base64 编码的 kubeconfig（或文件路径）列出 Kubernetes 资源。支持 pods、deployments、statefulsets、daemonsets、services、ingresses。默认：pods。"
    pt_BR: "Lista recursos do Kubernetes usando kubeconfig em base64 (ou caminho). Suporta pods, deployments, statefulsets, daemonsets, services, ingresses. Padrão: pods."
    ja_JP: "base64 の kubeconfig（またはパス）で Kubernetes リソースを一覧。pods, deployments, statefulsets, daemonsets, services, ingresses をサポート。デフォルト: pods。"
  llm: "List Kubernetes resources. Accepts resourceType and optional namespace. Returns items with basic attributes."
parameters:
  - name: namespace
    type: string
    required: false
    label:
      en_US: "Namespace"
      zh_Hans: "命名空间"
      pt_BR: "Namespace"
      ja_JP: "Namespace"
    human_description:
      en_US: "Optional namespace. If empty, lists across all namespaces."
      zh_Hans: "可选。为空则列出所有命名空间。"
      pt_BR: "Opcional. Vazio lista todos os namespaces."
      ja_JP: "任意。空の場合は全ての namespace を対象。"
    llm_description: "If provided, limit listing to this namespace; otherwise list all."
    form: llm
  - name: resourceType
    type: string
    required: false
    label:
      en_US: "Resource Type"
      zh_Hans: "资源类型"
      pt_BR: "Tipo de Recurso"
      ja_JP: "リソース種別"
    human_description:
      en_US: "Optional. pod/deploy/sts/ds/svc/ing (and full names). Default pod."
      zh_Hans: "可选。pod/deploy/sts/ds/svc/ing（及全称）。默认 pod。"
      pt_BR: "Opcional. pod/deploy/sts/ds/svc/ing (e nomes completos). Padrão pod."
      ja_JP: "任意。pod/deploy/sts/ds/svc/ing（および正式名）。デフォルト pod。"
    llm_description: "Resource kind (supports kubectl-style short names)"
    form: llm
extra:
  python:
    source: tools/k8s-list.py
output_schema:
  type: object
  properties:
    items:
      type: array
      description: "List of resources with basic attributes"
    timezone:
      type: string
    time:
      type: string
