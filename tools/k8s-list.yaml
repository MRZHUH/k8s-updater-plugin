identity:
  name: "k8s-list"
  author: "MRZHUH"
  label:
    en_US: "List Resources"
    zh_Hans: "获取资源列表"
    pt_BR: "Listar Recursos"
    ja_JP: "リソース一覧取得"
description:
  human:
    en_US: "List Kubernetes resources using base64-encoded kubeconfig (or file path). Supports nodes, pods, deployments, statefulsets, daemonsets, services, ingresses. Default: pods."
    zh_Hans: "使用 base64 编码的 kubeconfig（或文件路径）列出 Kubernetes 资源。支持 nodes、pods、deployments、statefulsets、daemonsets、services、ingresses。默认：pods。"
    pt_BR: "Lista recursos do Kubernetes usando kubeconfig em base64 (ou caminho). Suporta nodes, pods, deployments, statefulsets, daemonsets, services, ingresses. Padrão: pods."
    ja_JP: "base64 の kubeconfig（またはパス）で Kubernetes リソースを一覧。nodes, pods, deployments, statefulsets, daemonsets, services, ingresses をサポート。デフォルト: pods。"
  llm: "List Kubernetes resources. Accepts resourceType and optional namespace. Returns items with basic attributes."
parameters:
  - name: namespace
    type: string
    required: false
    label:
      en_US: "Namespace"
      zh_Hans: "命名空间"
      pt_BR: "Namespace"
      ja_JP: "Namespace"
    human_description:
      en_US: "Optional. If empty, defaults to 'default' for namespaced kinds; ignored for cluster-scoped (node)."
      zh_Hans: "可选。为空时命名空间类资源默认 'default'；对集群级（node）忽略。"
      pt_BR: "Opcional. Vazio usa 'default' para tipos com namespace; ignorado para escopo de cluster (node)."
      ja_JP: "任意。空なら namespace 対象は 'default'。クラスタスコープ（node）は無視。"
    llm_description: "Defaults to 'default' for namespaced kinds; ignored for node."
    form: llm
  - name: resourceType
    type: string
    required: true
    label:
      en_US: "Resource Type"
      zh_Hans: "资源类型"
      pt_BR: "Tipo de Recurso"
      ja_JP: "リソース種別"
    human_description:
      en_US: "Required. one of no/pod/deploy/sts/ds/svc/ing (or full names)."
      zh_Hans: "必填。no/pod/deploy/sts/ds/svc/ing（或全称）之一。"
      pt_BR: "Obrigatório. um de no/pod/deploy/sts/ds/svc/ing (ou nomes completos)."
      ja_JP: "必須。no/pod/deploy/sts/ds/svc/ing（正式名も可）のいずれか。"
    llm_description: "Required resource kind (supports kubectl-style short names)"
    form: llm
extra:
  python:
    source: tools/k8s-list.py
output_schema:
  type: object
  properties:
    items:
      type: array
      description: "List of resources with basic attributes"
    timezone:
      type: string
    time:
      type: string
