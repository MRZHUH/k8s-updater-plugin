identity:
  name: "k8s-env-update"
  author: "bond-zhu"
  label:
    en_US: "Update Environment Variables"
    zh_Hans: "更新环境变量"
    pt_BR: "Atualizar Variáveis de Ambiente"
    ja_JP: "環境変数更新"
description:
  human:
    en_US: "Update environment variables of Deployment/StatefulSet/DaemonSet across containers."
    zh_Hans: "更新 Deployment/StatefulSet/DaemonSet 的容器环境变量。"
    pt_BR: "Atualiza variáveis de ambiente em Deployment/StatefulSet/DaemonSet."
    ja_JP: "Deployment/StatefulSet/DaemonSet のコンテナ環境変数を更新。"
  llm: "Update env var for K8s workloads. Provide resource type, name, optional namespace, envKey and envValue."
parameters:
  - name: resourceType
    type: string
    required: true
    label:
      en_US: "Resource Type"
      zh_Hans: "资源类型"
      pt_BR: "Tipo de Recurso"
      ja_JP: "リソース種別"
    human_description:
      en_US: "One of deployment, statefulset, daemonset"
      zh_Hans: "可选 deployment/statefulset/daemonset"
      pt_BR: "Um de deployment, statefulset, daemonset"
      ja_JP: "deployment/statefulset/daemonset のいずれか"
    form: llm
    llm_description: "Choose workload kind"
  - name: name
    type: string
    required: true
    label:
      en_US: "Name"
      zh_Hans: "名称"
      pt_BR: "Nome"
      ja_JP: "名前"
    form: llm
    human_description:
      en_US: "Workload name"
      zh_Hans: "工作负载名称"
      pt_BR: "Nome do workload"
      ja_JP: "ワークロード名"
    llm_description: "Target resource name"
  - name: namespace
    type: string
    required: false
    label:
      en_US: "Namespace"
      zh_Hans: "命名空间"
      pt_BR: "Namespace"
      ja_JP: "Namespace"
    form: llm
    human_description:
      en_US: "Optional; default to 'default'"
      zh_Hans: "可选，默认 'default'"
      pt_BR: "Opcional; padrão 'default'"
      ja_JP: "任意、デフォルトは 'default'"
    llm_description: "Namespace of the workload"
  - name: envKey
    type: string
    required: true
    label:
      en_US: "Env Key"
      zh_Hans: "环境变量名"
      pt_BR: "Chave Env"
      ja_JP: "環境変数名"
    form: llm
    human_description:
      en_US: "Environment variable key"
      zh_Hans: "环境变量键"
      pt_BR: "Chave da variável"
      ja_JP: "環境変数キー"
    llm_description: "Environment variable key"
  - name: envValue
    type: string
    required: true
    label:
      en_US: "Env Value"
      zh_Hans: "环境变量值"
      pt_BR: "Valor Env"
      ja_JP: "環境変数値"
    form: llm
    human_description:
      en_US: "Environment variable value"
      zh_Hans: "环境变量值"
      pt_BR: "Valor da variável"
      ja_JP: "環境変数の値"
    llm_description: "Environment variable value"
  - name: container
    type: string
    required: false
    label:
      en_US: "Container"
      zh_Hans: "容器名称"
      pt_BR: "Container"
      ja_JP: "コンテナ名"
    form: llm
    human_description:
      en_US: "Optional; if provided, only update this container"
      zh_Hans: "可选；传入则仅修改该容器"
      pt_BR: "Opcional; se informado, atualiza apenas este container"
      ja_JP: "任意；指定時は当該コンテナのみ更新"
    llm_description: "Target container name; default updates all"
extra:
  python:
    source: tools/k8s-env-update.py
output_schema:
  type: object
  properties:
    changed:
      type: array
    unchanged:
      type: array