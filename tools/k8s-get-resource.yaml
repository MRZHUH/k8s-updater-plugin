identity:
  name: "k8s-get-resource"
  author: "bond-zhu"
  label:
    en_US: "Get Resource"
    zh_Hans: "获取资源"
    pt_BR: "Obter Recurso"
    ja_JP: "リソース取得"
description:
  human:
    en_US: "Get resource in JSON or YAML (node/pod/deployment/statefulset/daemonset/service/ingress). Default JSON."
    zh_Hans: "获取资源的 JSON 或 YAML（node/pod/deployment/statefulset/daemonset/service/ingress），默认 JSON。"
    pt_BR: "Obtenha recurso em JSON ou YAML (node/pod/deployment/statefulset/daemonset/service/ingress). Padrão JSON."
    ja_JP: "JSON または YAML でリソース取得（node/pod/deployment/statefulset/daemonset/service/ingress）。デフォルト JSON。"
  llm: "Return resource by type/name/namespace with selectable output format (json|yaml)."
parameters:
  - name: resourceType
    type: string
    required: true
    label:
      en_US: "Resource Type"
      zh_Hans: "资源类型"
      pt_BR: "Tipo de Recurso"
      ja_JP: "リソース種別"
    human_description:
      en_US: "One of node, pod, deployment, statefulset, daemonset, service, ingress"
      zh_Hans: "node、pod、deployment、statefulset、daemonset、service、ingress 之一"
      pt_BR: "Um de node, pod, deployment, statefulset, daemonset, service, ingress"
      ja_JP: "node, pod, deployment, statefulset, daemonset, service, ingress のいずれか"
    llm_description: "Resource kind"
    form: llm
  - name: name
    type: string
    required: false
    label:
      en_US: "Name"
      zh_Hans: "名称"
      pt_BR: "Nome"
      ja_JP: "名前"
    form: llm
    human_description:
      en_US: "Resource name; if empty, list resources"
      zh_Hans: "资源名称；为空则列出资源"
      pt_BR: "Nome do recurso; vazio lista recursos"
      ja_JP: "リソース名；空なら一覧"
    llm_description: "Optional. If missing, list resources"
  - name: namespace
    type: string
    required: false
    label:
      en_US: "Namespace"
      zh_Hans: "命名空间"
      pt_BR: "Namespace"
      ja_JP: "Namespace"
    form: llm
    human_description:
      en_US: "Optional; defaults to 'default' for namespaced kinds; ignored for node"
      zh_Hans: "可选；命名空间类资源默认 'default'；对 node 忽略"
      pt_BR: "Opcional; usa 'default' para tipos com namespace; ignorado para node"
      ja_JP: "任意；namespace 対象は 'default'。node には無視"
    llm_description: "Defaults to 'default' for namespaced kinds; ignored for node"
  - name: outputFormat
    type: string
    required: false
    label:
      en_US: "Output Format"
      zh_Hans: "输出格式"
      pt_BR: "Formato de Saída"
      ja_JP: "出力形式"
    form: llm
    human_description:
      en_US: "json or yaml, default json"
      zh_Hans: "json 或 yaml，默认 json"
      pt_BR: "json ou yaml, padrão json"
      ja_JP: "json または yaml、デフォルト json"
    llm_description: "Choose json or yaml (default json)"
extra:
  python:
    source: tools/k8s-get-resource.py
output_schema:
  type: object
  properties:
    object:
      type: object
    yaml:
      type: string
    items:
      type: array
    timezone:
      type: string
    time:
      type: string